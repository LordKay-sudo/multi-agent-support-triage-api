[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-support-triage-api"
version = "0.1.0"
description = "Production-style FastAPI service for multi-agent support ticket triage with LangGraph and Langfuse."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "langchain-core",
    "langgraph",
    "langfuse",
]

[project.optional-dependencies]
bedrock = ["langchain-aws"]
dev = ["httpx", "pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
